# This is a basic workflow to help you get started with Actions

name: deploy-website

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branches.
  push:
    branches: [master]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains two jobs called "Build_and_Deploy" & "Create_Wiki_Ingest_Pr"
  Build_and_Deploy:
    # mission: build the website and deploy to the gh-pages
    name: Build the website and deploy
    # the type of runner that the job will run on
    runs-on: ubuntu-latest
    # Set jobs-restricted permissions to the minimum required level
    # Build_and_Deploy needs GITHUB_TOKEN to deploy the gh-pages
    permissions:
      contents: write
      pages: write
      id-token: write
      
    # add event restriction
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repo & fetch update
        uses: actions/checkout@v4
        with:
          # "最近更新时间" 等 git 日志相关信息，需要拉取全部提交记录
          fetch-depth: 0
          # actions/checkout 签出软件仓库的步骤中，Github 工作流程会自动使用可用的 GITHUB_TOKEN 密钥与 Github 进行身份验证
          # 然后，尽管我在该步骤中注入了个人访问令牌作为环境变量，但它还是将该步骤中的凭据持久化，并在发布软件包的步骤中重复使用这些凭据。
          # 因此将该配置项设为false，可以使Github 工作流程在最后一步才使用个人访问令牌与 GitHub 进行身份验证
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          # 选择要使用的 pnpm 版本
          version: 8
          # 使用 pnpm 安装依赖
          run_install: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 选择要使用的 node 版本
          node-version: 20
          # 缓存 pnpm 依赖
          cache: pnpm

      # 运行构建脚本
      - name: Build VuePress site
        run: pnpm docs:build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          LOCK_ON_PASSWORD: ${{ secrets.LOCK_ON_PASSWORD }}

      # 写入自定义域名
      - name: Configure custom domain
        run: echo blog.jeacsonsnake.com >> docs/.vuepress/dist/CNAME

      # 查看 workflow 的文档来获取更多信息
      # @see https://github.com/crazy-max/ghaction-github-pages
      - name: Deploy to GitHub Pages
        if: success()
        uses: crazy-max/ghaction-github-pages@v5
        with:
          # 部署到 gh-pages 分支
          target_branch: gh-pages
          # 部署目录为 VuePress 的默认输出目录
          build_dir: docs/.vuepress/dist
        env:
          # @see https://docs.github.com/cn/actions/reference/authentication-in-a-workflow#about-the-github_token-secret
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Set jobs-restricted permissions to the minimum required level
# Build_and_Deploy needs GITHUB_TOKEN to deploy the gh-pages
# while create-wiki-ingest-pr needs pull-requests as write to open a PR
  Create_Wiki_Ingest_Pr:
    # mission: Open PR for wiki-ingest branch / 为 wiki-ingest-* 分支自动开 PR
    name: Open PR for wiki-ingest branch
    # the type of runner that the job will run on
    runs-on: ubuntu-latest
    # Set jobs-restricted permissions to the minimum required level
    # Create_Wiki_Ingest_Pr needs pull-requests as write to open a PR
    permissions:
      contents: write
      pull-requests: write
    
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/wiki-ingest-')
    
    steps:
      - name: Checkout repo & fetch update
        uses: actions/checkout@v4
        with:
          # "最近更新时间" 等 git 日志相关信息，需要拉取全部提交记录
          fetch-depth: 0
          # actions/checkout 签出软件仓库的步骤中，Github 工作流程会自动使用可用的 GITHUB_TOKEN 密钥与 Github 进行身份验证
          # 然后，尽管我在该步骤中注入了个人访问令牌作为环境变量，但它还是将该步骤中的凭据持久化，并在发布软件包的步骤中重复使用这些凭据。
          # 因此将该配置项设为false，可以使Github 工作流程在最后一步才使用个人访问令牌与 GitHub 进行身份验证
          persist-credentials: false
    
      - name: Verify branch name
        id: check
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          if [[ ! "$BRANCH" =~ ^wiki-ingest-[0-9]{4}-[0-9]{2}-[0-9]{2}(-[a-z0-9._-]+)?$ ]]; then
            echo "::error::Refusing: branch name '$BRANCH' does not match expected wiki-ingest-YYYY-MM-DD(-suffix)? pattern"
            exit 1
          fi
      
    # ┌──────────────────────────────────────────────────────────────────┐
    # │ IMPORTANT INVARIANT — DO NOT VIOLATE                             │
    # │                                                                  │
    # │ This workflow assumes each push to wiki-ingest-* branches        │
    # │ contains EXACTLY ONE commit.                                     │
    # │                                                                  │
    # │ Reason: PR title is taken from `git log -1 --pretty=%s HEAD`     │
    # │ and PR body from `git log -1 --pretty=%b HEAD`.                  │
    # │ If multiple commits are pushed, only the HEAD commit's message   │
    # │ is used as PR content — earlier commits are silently lost.       │
    # │                                                                  │
    # │ When this invariant is at risk of being broken:                  │
    # │   1. Stop the run                                                │
    # │   2. Surface the situation to the user                           │
    # │   3. Let the user decide: amend to single commit / squash /      │
    # │      open manual PR / accept partial visibility                  │
    # │                                                                  │
    # │ See vuepress-wiki-integration skill located in your hermes       │
    # │ agent for the source convention.                                 │
    # └──────────────────────────────────────────────────────────────────┘
      - name: Warn if push contains multiple commits
        id: multi
        run: |
          # 这次 push 引入的新 commit 数（HEAD~1..HEAD；首次 push 拉根）
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          
          # 首次 push（before 为全 0）时，没有可比较的旧提交
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            NEW=$(git rev-list --count HEAD)
          else
            NEW=$(git rev-list --count "${BEFORE}..${AFTER}")
          fi
          
          echo "new_commits=${NEW}" >> "$GITHUB_OUTPUT"
          if [ "$NEW" -gt 1 ]; then
            echo "::warning::This push introduced ${NEW} commits. PR will only use HEAD commit's message as title/body. Earlier commits will not appear in the PR description."
          fi

      
      - name: Check if PR already exists
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.check.outputs.branch }}"
          EXISTING=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "$BRANCH" \
            --state open \
            --json number -q 'length')
          echo "existing=${EXISTING}" >> "$GITHUB_OUTPUT"
          if [ "$EXISTING" -gt 0 ]; then
            echo "PR for $BRANCH already exists, skipping creation."
          fi

      - name: Open pull request
        if: steps.existing.outputs.existing == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MULTI: ${{ steps.multi.outputs.new_commits }}
        run: |
          BRANCH="${{ steps.check.outputs.branch }}"
          TITLE=$(git log -1 --pretty=%s HEAD)
          BODY=$(git log -1 --pretty=%b HEAD)
          if [ "$MULTI" -gt 1 ]; then
            WARNING="> ⚠️ This PR was opened from a push of ${MULTI} commits. The PR description below reflects only the HEAD commit; earlier commits are not visible here. See the branch's commit history for the full diff."
            if [ -n "$BODY" ]; then
              BODY="${WARNING}\n\n${BODY}"
            else
              BODY="${WARNING}"
            fi
          fi
          if [ -z "$BODY" ]; then
            BODY="Automated wiki/digest PR opened by Hermes deploy key on $(date -u +%FT%TZ)."
          fi
          gh pr create \
            --repo "${{ github.repository }}" \
            --head "$BRANCH" \
            --base master \
            --title "$TITLE" \
            --body "$BODY"

